<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315ca4"><title>Learn Anything</title><style>:root{font-family:system-ui,sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#1b2838}header{background:#315ca4;color:white;padding:24px 5vw}header h1{margin:0}main{max-width:1100px;margin:25px auto;padding:0 18px}.card{background:white;border:1px solid #d9e1ed;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #1b28380b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #aab9cb;border-radius:9px;max-width:100%}input,textarea,select{width:100%}label{display:block;margin:10px 0}button{cursor:pointer;background:#315ca4;color:white;border:0;margin:4px 5px 4px 0}button.secondary{background:#526477}small,.muted{color:#596a7c}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #e0e5ed}.scroll{overflow-x:auto}@media print{header,.no-print,button{display:none!important}body{background:white}.card{box-shadow:none;border:0}}</style><link rel="manifest" href="./manifest.webmanifest"></head><body><style>.marketlab-network{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;background:#152535;color:white;font:14px system-ui}.marketlab-network a{color:#fff;text-decoration:none;border:1px solid #6b7c8d;border-radius:20px;padding:6px 10px}.marketlab-network a[aria-current]{background:#fff;color:#152535}.marketlab-network .state{margin-left:auto}@media print{.marketlab-network{display:none}}</style><nav class="marketlab-network" aria-label="My applications"><strong>My apps</strong><a href="https://xbren56.github.io/GroupOps/">GroupOps</a><a href="https://xbren56.github.io/Recipes-/">Recipe Lab</a><a aria-current="page" href="https://xbren56.github.io/LearnAnyThing/">Learn Anything</a><a href="https://xbren56.github.io/BeadDesigns/">Bead Designer</a><span class="state" id="network-status"></span></nav><script>document.getElementById('network-status').textContent=navigator.onLine?'Online':'Offline';addEventListener('online',()=>document.getElementById('network-status').textContent='Online');addEventListener('offline',()=>document.getElementById('network-status').textContent='Offline');if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script><header><h1>Learn Anything</h1><div>Free • Offline-first • Your records stay in this browser</div></header><main><div class="grid"><section class="card"><h2>Create a lesson</h2><form id="entry"><label>Subject<input name="subject" required placeholder="Electronics"></label><label>Lesson title<input name="title" required></label><label>Study notes<textarea name="notes" rows="6" required></textarea></label><label>Quiz question<input name="question" required></label><label>Correct answer<input name="answer" required></label><button>Save lesson</button></form></section><section class="card"><h2>Lessons and practice</h2><label>Search<input id="search" oninput="render()"></label><div id="lessons"></div></section></div><div class="card no-print"><button onclick="exportData()">Export JSON backup</button><label>Import backup<input type="file" accept=".json,application/json" onchange="importData(this)"></label><small>Backups are not cloud synced. Do not put private backups in public GitHub repositories.</small></div></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));render()}catch(e){alert('Could not save locally: '+e.message)}}function exportData(){const blob=new Blob([JSON.stringify({app:KEY,version:1,records:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=KEY+'-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(input){const file=input.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x.app!==KEY||x.version!==1||!Array.isArray(x.records))throw Error('Wrong backup format');if(!confirm('Replace saved records with '+x.records.length+' imported items?'))return;data=x.records;save()}catch(e){alert(e.message)}finally{input.value=''}}const KEY='learnanything-v1';let data=load(KEY,[]);$('entry').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.push({id:id(),subject:f.get('subject'),title:f.get('title'),notes:f.get('notes'),question:f.get('question'),answer:f.get('answer'),done:false});save();e.target.reset()};function mark(k){const x=data.find(x=>x.id===k);if(x){x.done=!x.done;save()}}function check(k){const x=data.find(x=>x.id===k),v=$('answer-'+k).value.trim();$('result-'+k).textContent=v.toLowerCase()===x.answer.trim().toLowerCase()?'Correct!':'Not quite. Answer: '+x.answer}function removeLesson(k){if(confirm('Delete lesson?')){data=data.filter(x=>x.id!==k);save()}}function render(){const q=$('search').value.toLowerCase();$('lessons').innerHTML='<p>'+data.filter(x=>x.done).length+' of '+data.length+' lessons completed</p>'+data.filter(x=>(x.subject+' '+x.title).toLowerCase().includes(q)).map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><small>'+esc(x.subject)+'</small><details><summary>Study notes</summary><p style="white-space:pre-wrap">'+esc(x.notes)+'</p></details><p>'+esc(x.question)+'</p><input id="answer-'+x.id+'" placeholder="Your answer"><button onclick="check(\''+x.id+'\')">Check</button><p id="result-'+x.id+'"></p><button onclick="mark(\''+x.id+'\')">'+(x.done?'Mark unfinished':'Mark complete')+'</button><button class="secondary" onclick="removeLesson(\''+x.id+'\')">Delete</button></article>').join('')||'<p>No lessons yet.</p>'}render();</script></body></html>
